#boot.go .bc{opacity:0;transform:scale(.94)}

#boot .cd{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:cdi .6s var(--out) forwards;animation-delay:calc(var(--i)*48ms + .15s)}

<section class="sec alt" id="strategy" style="padding-bottom:0"><div class="in-w">
  <div class="hd"><p class="sk rv">02 · Strategy</p><h2 class="h2" data-split style="max-width:16ch">Three gates. <em>One rule.</em></h2><p class="sub rv">Every entry needs three things to agree. If any one is missing, there is no trade. Scroll to watch the rule play out.</p></div>
</div>
<div class="stratwrap" id="sw"><div class="pin"><div class="in-w" style="display:contents">
  <div class="ptop"><span class="kick">Live walkthrough</span><div class="tog" id="tog"><button class="on" data-m="0">LONG</button><button data-m="1">SHORT</button></div></div>
  <div class="gates" id="gates"></div>
  <div class="cv"><canvas id="sc"></canvas><span class="cvl">Illustration · synthetic data</span></div>
  <div class="capb" id="capb"><span class="k"></span><span class="t"></span><span class="d"></span><div class="pbar" id="pbar" role="slider" aria-label="Scrub the walkthrough" aria-valuemin="0" aria-valuemax="100" tabindex="0"><i id="pbi"></i><b id="pbt"></b></div><span class="pbh">Drag the bar to replay or scrub</span></div>
</div></div></div>
<div class="in-w" style="padding-bottom:clamp(60px,9vw,110px)">
  <div class="rules">
    <div class="rule rv"><h3>The <em>long</em> checklist</h3><ol><li>HalfTrend prints a <b>Buy</b> signal.</li><li>The higher timeframe confirms the same direction.</li><li>Hull Suite prints a <b>green</b> ribbon.</li></ol><div class="go">All three: enter long</div></div>
    <div class="rule sh rv" style="--d:120ms"><h3>The <em>short</em> checklist</h3><ol><li>HalfTrend prints a <b>Sell</b> signal.</li><li>The higher timeframe confirms the same direction.</li><li>Hull Suite prints a <b>red</b> ribbon.</li></ol><div class="go">All three: enter short</div></div>
  </div>
  <div class="inds">
    <div class="ind rv"><small>Indicator 01</small><h4>Hull Suite by InSilico</h4><p>A Hull Moving Average drawn as a ribbon. It is built from weighted averages in a way that cuts the lag of an ordinary moving average while staying smooth. The ribbon prints green while it slopes up and red while it slopes down. The charts in this report use a length of 55.</p><p class="role"><b>Its job here:</b> the momentum filter. If the ribbon disagrees with the signal, the trade is skipped.</p><span class="rb2"></span></div>
    <div class="ind rv" style="--d:120ms"><small>Indicator 02</small><h4>HalfTrend</h4><p>A trend indicator that tracks a midline between recent highs and lows, buffered by volatility. It only flips when price breaks decisively through that line, then prints a Buy or Sell label at the turn.</p><p class="role"><b>Its job here:</b> the trigger. It tells me when to look, and it never decides a trade alone.</p><div class="sg"><span class="b">Buy</span><span class="s">Sell</span></div></div>
  </div>
  <p class="note rv">On the real charts below, each setup is mapped with a stop and a target, shown as the shaded boxes. One example carries a risk to reward of 1.63.</p>
  <div class="wsub"><p class="sk rv">Why it holds up</p><h3 class="h3 rv">Not magic. <em>Structure.</em></h3>
   <div class="wg">
    <article class="wc rv"><span class="wn">01</span><h4>Confluence filters noise</h4><p>One indicator on its own fires constantly and is often wrong. Requiring a signal, a higher timeframe and a ribbon to agree removes many weak entries, because noise rarely lines up three times in a row.</p></article>
    <article class="wc rv" style="--d:80ms"><span class="wn">02</span><h4>It respects the bigger trend</h4><p>The higher timeframe check keeps each trade aligned with the larger flow of the market, so I am not fighting the tide on a small 15 minute wiggle.</p></article>
    <article class="wc rv" style="--d:160ms"><span class="wn">03</span><h4>Rules are objective</h4><p>Each gate is either printed on the chart or it is not. That removes hunches, hesitation and revenge trades, and it makes every trade easy to review afterwards.</p></article>
    <article class="wc rv"><span class="wn">04</span><h4>Risk is set before entry</h4><p>Stop and target are mapped first, and the size is chosen so a stop out costs a fixed, pre-decided amount. A single loss is a small, known number rather than a surprise.</p></article>
    <article class="wc rv" style="--d:80ms"><span class="wn">05</span><h4>It is repeatable and testable</h4><p>The same rules apply to every pair, so results can be journaled, measured and improved. A hunch cannot be tested; a rule set can.</p></article>
    <article class="wc rv" style="--d:160ms"><span class="wn">06</span><h4>Patience is part of the edge</h4><p>Most of the time the three gates are not aligned, so most of the time the correct action is nothing. Skipping weak setups protects capital for the strong ones.</p></article>
   </div></div>
  <div class="wsub"><p class="sk rv">Anatomy of a trade</p><h3 class="h3 rv">Four steps, <em>every time.</em></h3>
   <div class="atl" id="atl"><div class="spine"><i id="spf"></i></div>
    <article class="st rv" data-a="zoom"><span class="nd">1</span><div class="stc"><small>Step one</small><h4>Wait</h4><p>Look for a HalfTrend Buy or Sell. No signal, no trade.</p>
     <svg class="mini" viewBox="0 0 300 110" aria-hidden="true"><path class="g1" d="M0 74 L28 70 L52 78 L78 71 L104 76 L130 69 L156 73 L182 66 L208 58 L234 44 L262 30"/><g class="bb"><rect x="226" y="48" width="48" height="20" rx="5"/><text x="250" y="62">Buy</text></g><circle class="rg" cx="262" cy="30" r="5"/></svg></div></article>
    <article class="st rv" data-a="zoom"><span class="nd">2</span><div class="stc"><small>Step two</small><h4>Confirm</h4><p>Check that the higher timeframe agrees and the Hull ribbon has the matching colour.</p>
     <div class="gts"><div class="gt" style="--k:0"><span>HalfTrend signal</span><i class="tg2"></i></div><div class="gt" style="--k:1"><span>Higher timeframe agrees</span><i class="tg2"></i></div><div class="gt" style="--k:2"><span>Hull ribbon matches</span><i class="tg2"></i></div><div class="ok">All gates open</div></div></div></article>
    <article class="st rv" data-a="zoom"><span class="nd">3</span><div class="stc"><small>Step three</small><h4>Map</h4><p>Mark entry, stop and target before clicking. Size the position so the stop costs a fixed amount.</p>
     <svg class="mini" viewBox="0 0 300 120" aria-hidden="true"><rect class="tp" x="30" y="22" width="250" height="40"/><rect class="sl" x="30" y="62" width="250" height="28"/><line class="en" x1="30" y1="62" x2="280" y2="62"/><text class="lb t" x="38" y="38">Target</text><text class="lb s" x="38" y="82">Stop</text><text class="lb e" x="244" y="56">Entry</text></svg></div></article>
    <article class="st rv" data-a="zoom"><span class="nd">4</span><div class="stc"><small>Step four</small><h4>Let it play</h4><p>The target or the stop ends the trade. If the idea was wrong, the stop is the plan working.</p>
     <svg class="mini" viewBox="0 0 300 120" aria-hidden="true"><line class="tl2" x1="20" y1="26" x2="280" y2="26"/><line class="el2" x1="20" y1="84" x2="280" y2="84"/><path class="g2" d="M20 84 L50 80 L76 88 L104 76 L132 70 L160 74 L188 56 L216 44 L246 30 L262 26"/><g class="bb2"><rect x="198" y="4" width="84" height="20" rx="6"/><text x="240" y="18">Target hit</text></g><text class="lb e" x="24" y="100">Entry</text></svg></div></article>
   </div></div>
  <div class="rrc rv"><h3>The arithmetic of risk and reward</h3><p>Because every trade has a mapped stop and target, the win rate needed to break even is simple to compute. Drag the slider.</p>
   <div class="rrrow"><label for="rr">Risk to reward <b id="rrv">1.63</b></label><input type="range" id="rr" min="0.5" max="3" step="0.01" value="1.63" aria-label="Risk to reward ratio"></div>
   <div class="be"><div class="betr"><i id="bef"></i><em id="bem">Log 79%</em></div><div class="bel"><span>0%</span><span>Break-even win rate <b id="beb">38%</b></span><span>100%</span></div></div>
   <p class="fine">Before fees and slippage. At the 1.63 shown on the YGG chart, roughly 4 winners in 10 trades is enough to break even. The log shows 12 wins in 15 closed orders, but 15 orders is far too few to treat as a true win rate.</p></div>
  <div class="lim rv"><h3>Where it <em>struggles</em></h3><ul><li><b>Sideways markets.</b> Signals can flip back and forth with no follow through, producing small losses.</li><li><b>Lag.</b> Confirmation costs a little of the move. A cleaner entry often comes at a slightly worse price.</li><li><b>Small sample.</b> Six demo days show the process working. They do not prove it works over months. That is exactly why the next step matters.</li></ul></div>
</div></section>
